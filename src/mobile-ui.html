<!-- =================== MOBILE EDITION (touch-first) ===================== -->
<style>
  /* PC badge off, mobile badge on */
  #edbadge{display:none !important}
  #edbadge-m{position:absolute;right:10px;bottom:8px;z-index:30;pointer-events:none;
    font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#7cf0ff;
    background:rgba(6,12,24,.6);border:1px solid #24344f;border-radius:999px;padding:5px 10px}
  /* bigger tap targets everywhere */
  .btn{padding:15px 22px;font-size:14px}
  .btn.small{padding:11px 15px;font-size:12px}
  .tab{padding:12px 14px;font-size:12px}
  #tabs .tab,.shopTabs .tab{min-height:44px;display:flex;align-items:center}
  .lvb{min-height:40px;font-size:13px}
  input#inp-name{width:min(300px,80vw);padding:13px 14px;font-size:16px}
  /* touch controls */
  #mctrl{position:absolute;inset:0;z-index:40;display:none;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  body.mobile #mctrl.on{display:block}
  body.mobile #touch{display:none !important}
  #mjoy{position:absolute;left:18px;bottom:22px;width:150px;height:150px;pointer-events:auto;touch-action:none}
  #mjoy-base{position:absolute;inset:0;border-radius:50%;background:rgba(10,18,34,.5);
    border:2px solid rgba(120,160,220,.35)}
  #mjoy-base:before,#mjoy-base:after{content:'';position:absolute;background:rgba(120,160,220,.25)}
  #mjoy-base:before{left:50%;top:12px;bottom:12px;width:2px;transform:translateX(-1px)}
  #mjoy-base:after{top:50%;left:12px;right:12px;height:2px;transform:translateY(-1px)}
  #mjoy-knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#8fd7ff,#2a6ea8);border:2px solid #cfe0ff;
    box-shadow:0 0 18px rgba(84,216,255,.45);transition:transform .04s linear}
  #mjoy-hint{position:absolute;left:0;right:0;bottom:-4px;text-align:center;color:#7d90b8;
    font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.16em}
  #mthr{position:absolute;right:20px;bottom:22px;width:74px;height:210px;pointer-events:auto;touch-action:none;
    border-radius:38px;background:rgba(10,18,34,.55);border:2px solid rgba(120,160,220,.35);overflow:hidden}
  #mthr-fill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(0deg,#ff9a3c,#ffd782);opacity:.75}
  #mthr-knob{position:absolute;left:-6px;right:-6px;height:8px;bottom:0;background:#cfe0ff;
    box-shadow:0 0 14px rgba(84,216,255,.6)}
  #mthr-lbl{position:absolute;left:0;right:0;top:7px;text-align:center;color:#cfe0ff;
    font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.14em;text-shadow:0 1px 3px #000}
  #mbtns{position:absolute;right:108px;bottom:26px;display:grid;gap:11px;justify-items:end;pointer-events:auto}
  #mbtns .mb{width:82px;height:52px;border-radius:14px;background:rgba(16,26,46,.78);border:2px solid #33466e;
    color:#cfe0ff;font:900 12px ui-monospace,Consolas,monospace;letter-spacing:.1em;display:grid;place-items:center}
  #mbtns .mb.on{background:rgba(84,216,255,.32);border-color:#7cf0ff;color:#fff}
  #mb-fire{width:104px;height:78px;font-size:15px;background:rgba(255,90,90,.28);border-color:#ff6a6a}
  #mb-fire:active{background:rgba(255,90,90,.6)}
  #mrot{position:absolute;inset:0;z-index:60;display:none;place-items:center;text-align:center;
    background:rgba(4,8,16,.92);color:#cfe0ff;font:800 14px ui-monospace,Consolas,monospace;letter-spacing:.1em;padding:24px}
  body.mobile.portrait #mrot{display:grid}
  /* mobile HUD tweaks */
  body.mobile #hud{font-size:12px}
</style>

<div id="mctrl">
  <div id="mjoy"><div id="mjoy-base"></div><div id="mjoy-knob"></div><div id="mjoy-hint">STEER</div></div>
  <div id="mthr"><div id="mthr-fill"></div><div id="mthr-knob"></div><span id="mthr-lbl">THROTTLE</span></div>
  <div id="mbtns">
    <button class="mb" id="mb-auto">AUTO ✸</button>
    <button class="mb" id="mb-eng">ENG ⏻</button>
    <button class="mb" id="mb-pause">⏸ PAUSE</button>
    <button class="mb" id="mb-fire">🔥 FIRE</button>
  </div>
</div>
<div id="mrot"><div>📱 ROTATE TO LANDSCAPE<div style="margin-top:12px;color:#7d90b8;font-size:11px">ROCKET ASCENT plays best sideways</div></div></div>
<div id="edbadge-m">📱 MOBILE EDITION — touch</div>
